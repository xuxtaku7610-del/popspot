# Gradle memory settings for PopSpot Android project
# Put this file in the project root: F:\Kotlin-project\gradle.properties

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
